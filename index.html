<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>नागरिक सेवा - अनलाइन पटके दर्ता</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gov-blue: #1E3A8A; --gov-red: #E11D48; --bg: #F8FAFC; }
        * { box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { margin: 0; background: var(--bg); color: #0F172A; }
        .header { background: #fff; padding: 15px 20px; border-bottom: 2px solid var(--gov-red); text-align: center; }
        .header h2 { margin: 0; color: var(--gov-blue); font-size: 20px; }
        .header p { margin: 2px 0 0 0; color: var(--gov-red); font-weight: bold; font-size: 14px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: #fff; padding: 18px; border-radius: 10px; border: 1px solid #E2E8F0; margin-bottom: 15px; }
        .card-title { font-weight: 800; color: var(--gov-blue); margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 13px; font-weight: 700; color: #475569; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px; outline: none; }
        .readonly-box { background: #F1F5F9; font-weight: bold; }
        .btn { width: 100%; padding: 12px; background: var(--gov-blue); color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 16px; cursor: pointer; }
        .btn-print { background: #059669; margin-top: 10px; display: none; }
        @media print { .no-print { display: none !important; } .print-area { display: block !important; } }
        .print-area { display: none; padding: 20px; border: 2px solid var(--gov-blue); border-radius: 8px; background: white; }
    </style>
</head>
<body>

<div class="header no-print">
    <h2>यातायात व्यवस्था कार्यालय, बागलुङ</h2>
    <p>सार्वजनिक पटके अनलाइन आवेदन प्रणाली</p>
</div>

<div class="container no-print">
    <div class="card">
        <div class="card-title">१. रुट छनौट</div>
        <div class="form-group">
            <label>प्रस्थान विन्दु (FROM):</label>
            <select id="from-select" onchange="onFromChange()"><option value="">-- छान्नुहोस् --</option></select>
        </div>
        <div class="form-group">
            <label>गन्तव्य विन्दु (TO):</label>
            <select id="to-select" onchange="onToChange()" disabled><option value="">-- पहिले प्रस्थान छान्नुहोस् --</option></select>
        </div>
    </div>

    <div class="card">
        <div class="card-title">२. सवारी विवरण</div>
        <div class="form-group"><label>सवारी नम्बर:</label><input type="text" id="v-no" placeholder="उदा: ध १ ख १२३४"></div>
        <div class="form-group"><label>लाइसेन्स नम्बर:</label><input type="text" id="l-no" placeholder="इजाजत पत्र नं"></div>
    </div>

    <div class="card">
        <div class="card-title">३. हिसाब विवरण</div>
        <div class="form-group"><label>छानिएको रुट:</label><input type="text" id="route-name" class="readonly-box" readonly></div>
        <div class="form-group"><label>दुरी (Km):</label><input type="text" id="v-dist" class="readonly-box" readonly></div>
    </div>

    <div class="card">
        <div class="card-title">४. कागजात अपलोड</div>
        <div class="form-group"><label>रुट पर्मिट:</label><input type="file" id="route-photo" accept="image/*"></div>
        <div class="form-group"><label>जाँचपास:</label><input type="file" id="fit-photo" accept="image/*"></div>
    </div>

    <button id="submit-btn" class="btn" onclick="submitPublicForm()">📤 विवरण बुझाउनुहोस्</button>
    <button id="print-btn" class="btn btn-print" onclick="window.print()">🖨️ रसिद प्रिन्ट गर्नुहोस्</button>
</div>

<!-- Receipt Template for Print -->
<div class="print-area">
    <h3 style="text-align:center; color:var(--gov-blue); margin:0;">यातायात व्यवस्था कार्यालय, बागलुङ</h3>
    <h4 style="text-align:center; margin:5px 0 15px 0;">पटके यात्रा इजाजत–पत्र (Public Receipt)</h4>
    <hr>
    <p><b>सवारी साधन नम्बर:</b> <span id="p-vno"></span></p>
    <p><b>इजाजत पत्र नं:</b> <span id="p-lno"></span></p>
    <p><b>रुट:</b> <span id="p-route"></span></p>
    <p><b>दुरी:</b> <span id="p-dist"></span></p>
    <p><b>मिति:</b> <span id="p-date"></span></p>
</div>

<script>
    // यहाँ आफ्नो GOOGLE APPS SCRIPT WEB APP URL राख्नुहोस्
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxmhQD8Hm_qsHmWZhWMxG4ZvOvURfmcFISxk9VKmwQC3Cm1kwFTRVnUIMl1h_jFl0iIw/exec";

    const routeData = [
        { from: "muktinath", to: "baglung", km: 107 },
        { from: "korola boarder", to: "baglung", km: 211 },
        { from: "muktinath", to: "muglin", km: 264 },
        { from: "korola boarder", to: "muglin", km: 357 },
        { from: "butwal", to: "kharbang", km: 144 },
        { from: "suppadeurali", to: "kharbang", km: 142 },
        { from: "suppadeurali", to: "baglung", km: 147 },
        { from: "butwal", to: "ramdi", km: 62 },
        { from: "rukumkot", to: "burtibang", km: 89 },
        { from: "khalanga rukum west", to: "burtibang", km: 106 },
        { from: "tamghas", to: "kharbang", km: 38 },
        { from: "dhopatan", to: "baglung", km: 130 },
        { from: "butwal", to: "belbagar baglung", km: 176 },
        { from: "beni", to: "baglung", km: 26 },
        { from: "singha tatopani", to: "baglung", km: 38 },
        { from: "bhurung tatopani", to: "baglung", km: 70 },
        { from: "narayanghat", to: "baglung", km: 202 },
        { from: "kathmandu", to: "baglung", km: 278 },
        { from: "kathmandu", to: "muglin", km: 110 },
        { from: "galkot", to: "baglung", km: 54 },
        { from: "tamghas", to: "baglung", km: 103 },
        { from: "palpa", to: "baglung", km: 136 },
        { from: "ridi", to: "baglung", km: 85 }
    ];

    function initRoutes() {
        const fromSelect = document.getElementById('from-select');
        const uniqueFrom = [...new Set(routeData.map(item => item.from))].sort();
        uniqueFrom.forEach(f => {
            let opt = document.createElement('option');
            opt.value = f; 
            opt.textContent = f.toUpperCase();
            fromSelect.appendChild(opt);
        });
    }

    function onFromChange() {
        const sel = document.getElementById('from-select').value;
        const toSel = document.getElementById('to-select');
        toSel.innerHTML = '<option value="">-- छान्नुहोस् --</option>';
        if(!sel) { toSel.disabled = true; return; }
        
        routeData.filter(i => i.from === sel).forEach(i => {
            let opt = document.createElement('option');
            opt.value = i.to; 
            opt.textContent = i.to.toUpperCase() + ` (${i.km} Km)`;
            opt.dataset.km = i.km;
            toSel.appendChild(opt);
        });
        toSel.disabled = false;
    }

    function onToChange() {
        const f = document.getElementById('from-select').value;
        const tOpt = document.getElementById('to-select').options[document.getElementById('to-select').selectedIndex];
        if(!tOpt.value) return;
        document.getElementById('route-name').value = f.toUpperCase() + " ➔ " + tOpt.value.toUpperCase();
        document.getElementById('v-dist').value = tOpt.dataset.km + " Km";
    }

    const fileToBase64 = file => new Promise((res, rej) => {
        const reader = new FileReader(); 
        reader.readAsDataURL(file);
        reader.onload = () => res({ data: reader.result.split(',')[1], type: file.type });
        reader.onerror = err => rej(err);
    });

    async function submitPublicForm() {
        const vNo = document.getElementById('v-no').value;
        const lNo = document.getElementById('l-no').value;
        const route = document.getElementById('route-name').value;
        const dist = document.getElementById('v-dist').value;
        const routeFile = document.getElementById('route-photo').files[0];
        const fitFile = document.getElementById('fit-photo').files[0];

        if(!vNo || !lNo || !route) { 
            alert("कृपया सम्पूर्ण विवरण भर्नुहोस्!"); 
            return; 
        }

        const btn = document.getElementById('submit-btn');
        btn.innerText = "पठाउँदैछ..."; 
        btn.disabled = true;

        try {
            let routeP = routeFile ? await fileToBase64(routeFile) : null;
            let fitP = fitFile ? await fileToBase64(fitFile) : null;

            const payload = {
                action: "submitForm",
                date: new Date().toLocaleDateString('ne-NP'),
                vNo: vNo, 
                lNo: lNo, 
                route: route, 
                dist: dist,
                routePhoto: routeP, 
                fitPhoto: fitP
            };

            // Using text/plain header to bypass browser CORS restriction
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify(payload) 
            });

            document.getElementById('p-vno').innerText = vNo;
            document.getElementById('p-lno').innerText = lNo;
            document.getElementById('p-route').innerText = route;
            document.getElementById('p-dist').innerText = dist;
            document.getElementById('p-date').innerText = payload.date;

            btn.innerText = "सफलतापूर्वक बुझाइयो!";
            document.getElementById('print-btn').style.display = 'block';
            alert("तपाईँको विवरण अनलाइन दर्ता भयो। रसिद प्रिन्ट गर्न सक्नुहुन्छ।");
        } catch (e) {
            console.error(e);
            alert("त्रुटि भयो! कृपया SCRIPT_URL र इन्टरनेट जाँच्नुहोस्।");
            btn.innerText = "📤 विवरण बुझाउनुहोस्"; 
            btn.disabled = false;
        }
    }

    window.onload = initRoutes;
</script>
</body>
</html>
