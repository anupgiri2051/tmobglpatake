<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कार्यालय एडमिन पोर्टल | पटके स्वीकृति प्रणाली</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gov-blue: #1E3A8A; --gov-red: #B91C1C; }
        * { box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { margin: 0; background-color: #F1F5F9; }
        .navbar { background: var(--gov-blue); color: #fff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; font-size: 18px; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        th { background: #F8FAFC; color: #334155; }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .Pending { background: #FEF08A; color: #854D0E; }
        .Approved { background: #DCFCE7; color: #166534; }
        .Rejected { background: #FEE2E2; color: #991B1B; }

        .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 12px; }
        .btn-approve { background: #166534; }
        .btn-reject { background: #991B1B; }
        
        .photo-link { color: #0284C7; text-decoration: none; font-weight: bold; }
        .photo-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="navbar">
    <h2>🏛️ कार्यालय एडमिन प्यानल - पटके स्वीकृति फारम</h2>
    <button onclick="loadApplications()" style="padding:8px 15px; background:#fff; color:var(--gov-blue); border:none; border-radius:5px; cursor:pointer; font-weight:bold;">🔄 रिफ्रेश गर्नुहोस्</button>
</div>

<div class="container">
    <div class="card">
        <h3>📋 दर्ता भएका पटके आवेदनहरू</h3>
        <table>
            <thead>
                <tr>
                    <th>दर्ता मिति</th>
                    <th>सवारी नं</th>
                    <th>लाइसेन्स नं</th>
                    <th>रुट (Route)</th>
                    <th>दुरी</th>
                    <th>कागजातहरू</th>
                    <th>स्थिति (Status)</th>
                    <th>राजस्व रकम</th>
                    <th>म्याद (Expired)</th>
                    <th>कार्य (Action)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="10" style="text-align:center;">डाटा तान्दैछ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB7IF7DlkPoxZIU2Z_gOCziQUBkKE3eCufIB_ffgHrlFRaol1rUsFFiFL2_iJZsXoQ9g/exec";

    async function loadApplications() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;">लोड हुँदैछ...</td></tr>`;

        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;">कुनै डाटा भेटिएन।</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date}</td>
                    <td><b>${item.vNo}</b></td>
                    <td>${item.lNo}</td>
                    <td>${item.route}</td>
                    <td>${item.dist}</td>
                    <td>
                        ${item.routePhoto ? `<a href="${item.routePhoto}" target="_blank" class="photo-link">रुट पर्मिट</a><br>` : 'नो फोटो<br>'}
                        ${item.fitPhoto ? `<a href="${item.fitPhoto}" target="_blank" class="photo-link">जाँचपास</a>` : 'नो फोटो'}
                    </td>
                    <td><span class="badge ${item.status}">${item.status}</span></td>
                    <td><input type="number" id="amt-${item.id}" value="${item.amount || 500}" style="width:70px;"></td>
                    <td><input type="date" id="exp-${item.id}" value="${item.expDate || item.date}"></td>
                    <td>
                        <button class="btn-action btn-approve" onclick="updateStatus(${item.id}, 'Approved')">स्वीकृत</button>
                        <button class="btn-action btn-reject" onclick="updateStatus(${item.id}, 'Rejected')">अस्वीकृत</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch(e) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:red;">डाटा लोड गर्न सकिएन!</td></tr>`;
        }
    }

    async function updateStatus(rowId, status) {
        const expDate = document.getElementById(`exp-${rowId}`).value;
        const amount = document.getElementById(`amt-${rowId}`).value;

        if(!confirm(`के तपाईं यो फारम ${status} गर्न चाहनुहुन्छ?`)) return;

        const payload = {
            action: "updateStatus",
            rowId: rowId,
            status: status,
            expDate: expDate,
            amount: amount
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            alert(`फारम सफलतापूर्वक ${status} गरियो!`);
            loadApplications();
        } catch(e) {
            alert("अपडेट गर्न सकिएन!");
        }
    }

    // सुरुमा डाटाहरू लोड गर्ने
    window.onload = loadApplications;
</script>
</body>
</html>
