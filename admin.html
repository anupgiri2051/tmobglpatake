<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>कार्यालय प्रयोगकर्ता पोर्टल (Official Portal)</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mukta', sans-serif; background: #F1F5F9; margin: 0; padding: 20px; }
        .header { background: #1E3A8A; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .login-card { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #1E3A8A; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        th { background: #3B82F6; color: white; }
        .img-link { color: #2563EB; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<!-- Passcode Protection -->
<div id="login-sec" class="login-card">
    <h2>🔒 कर्मचारी लगइन</h2>
    <p>आधिकारिक प्रयोगको लागि पासकोड हान्नुहोस्:</p>
    <input type="password" id="passcode" placeholder="Passcode (उदा: 1234)"><br>
    <button onclick="login()">लगइन गर्नुहोस्</button>
</div>

<!-- Admin Dashboard -->
<div id="admin-sec" style="display: none;">
    <div class="header">
        <h2>🏛️ पटके अनलाइन रेकर्ड पोर्टल (कार्यालय प्रयोग)</h2>
        <button onclick="fetchData()" style="background:#059669;">🔄 डाटा रिफ्रेस गर्नुहोस्</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>मिति</th>
                <th>सवारी नम्बर</th>
                <th>लाइसेन्स नम्बर</th>
                <th>रुट</th>
                <th>दुरी</th>
                <th>रुट पर्मिट</th>
                <th>जाँचपास फोटो</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="7">डाटा लोड हुँदैछ...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0Y_nc46vlPm4Fd2x8HUI9c3hc9uRwodyRDul4CWcf4Pod9JaWeqj9NI2lGTD5jV148Q/exec";
    const OFFICIAL_PASSCODE = "1234"; // तपाईँको कार्यालयको लागि गोप्य पासवर्ड

    function login() {
        const pass = document.getElementById('passcode').value;
        if(pass === OFFICIAL_PASSCODE) {
            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('admin-sec').style.display = 'block';
            fetchData();
        } else {
            alert("गलत पासकोड!");
        }
    }

    async function fetchData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '<tr><td colspan="7">लोड हुँदैछ... पर्खनुहोस्।</td></tr>';
        
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">कुनै रेकर्ड भेटिएन।</td></tr>';
                return;
            }

            data.reverse().forEach(row => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.date || '-'}</td>
                    <td><b>${row.vNo || '-'}</b></td>
                    <td>${row.lNo || '-'}</td>
                    <td>${row.route || '-'}</td>
                    <td>${row.dist || '-'}</td>
                    <td>${row.routePhoto ? `<a href="${row.routePhoto}" target="_blank" class="img-link">🖼️ हेर्नुहोस्</a>` : 'छैन'}</td>
                    <td>${row.fitPhoto ? `<a href="${row.fitPhoto}" target="_blank" class="img-link">🖼️ हेर्नुहोस्</a>` : 'छैन'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="7" style="color:red;">डाटा तान्न सकिएन!</td></tr>';
        }
    }
</script>
</body>
</html>
