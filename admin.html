<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>कार्यालय स्वीकृत पोर्टल (Official Admin Portal)</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mukta', sans-serif; background: #F1F5F9; margin: 0; padding: 20px; }
        .header { background: #1E3A8A; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .login-card { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-approve { background: #16A34A; margin-right: 5px; }
        .btn-reject { background: #DC2626; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        th { background: #1E3A8A; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-Pending { background: #FEF08A; color: #854D0E; }
        .badge-Approved { background: #BBF7D0; color: #166534; }
        .badge-Rejected { background: #FECDD3; color: #991B1B; }
    </style>
</head>
<body>

<div id="login-sec" class="login-card">
    <h2>🔒 कार्यालय एडमिन लगइन</h2>
    <input type="password" id="passcode" placeholder="Passcode (उदा: 1234)"><br>
    <button style="background:#1E3A8A;" onclick="login()">लगइन गर्नुहोस्</button>
</div>

<div id="admin-sec" style="display: none;">
    <div class="header">
        <h2>🏛️ आवेदन प्रमाणीकरण र स्वीकृति पोर्टल</h2>
        <button onclick="fetchData()" style="background:#059669;">🔄 डाटा रिफ्रेस</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>मिति</th>
                <th>सवारी नं</th>
                <th>लाइसेन्स नं</th>
                <th>रुट (दुरी)</th>
                <th>कागजातहरू</th>
                <th>स्थिति</th>
                <th>कार्य (Action)</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="7">लोड हुँदैछ...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjSOGqaIHZosAdh2cIT9AGEuTPS-G0CdtYSPXyaPn95uGT1OViN3rdtq-aaoxF7c7_hg/exec";
    const OFFICIAL_PASSCODE = "1234"; 

    function login() {
        if(document.getElementById('passcode').value === OFFICIAL_PASSCODE) {
            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('admin-sec').style.display = 'block';
            fetchData();
        } else { alert("गलत पासकोड!"); }
    }

    async function fetchData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '<tr><td colspan="7">लोड हुँदैछ... पर्खनुहोस्।</td></tr>';
        
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            tbody.innerHTML = '';

            data.reverse().forEach(row => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.date}</td>
                    <td><b>${row.vNo}</b></td>
                    <td>${row.lNo}</td>
                    <td>${row.route} (${row.dist})</td>
                    <td>
                        ${row.routePhoto ? `<a href="${row.routePhoto}" target="_blank">📄 रुट पर्मिट</a>` : 'छैन'} | 
                        ${row.fitPhoto ? `<a href="${row.fitPhoto}" target="_blank">📄 जाँचपास</a>` : 'छैन'}
                    </td>
                    <td><span class="badge badge-${row.status}">${row.status}</span></td>
                    <td>
                        <button class="btn-approve" onclick="updateStatus('${row.vNo}', 'Approved')">Approve</button>
                        <button class="btn-reject" onclick="updateStatus('${row.vNo}', 'Rejected')">Reject</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch(e) { tbody.innerHTML = '<tr><td colspan="7">त्रुटि भयो!</td></tr>'; }
    }

    async function updateStatus(vNo, status) {
        if(!confirm(`के तपाईँ सवारी ${vNo} लाई ${status} गर्न चाहनुहुन्छ?`)) return;

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "updateStatus", vNo: vNo, status: status })
            });
            alert(`सफलतापूर्वक ${status} गरियो!`);
            fetchData();
        } catch(e) { alert("अपडेट गर्न सकिएन!"); }
    }
</script>
</body>
</html>
