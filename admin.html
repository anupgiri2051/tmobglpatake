<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन ड्यासबोर्ड | पटके प्रणाली</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Nepali Date Picker CSS & JS -->
    <link href="https://nepalidatetimepicker.page365.com.np/nepali.datepicker.v4.0.1.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://nepalidatetimepicker.page365.com.np/nepali.datepicker.v4.0.1.min.js" type="text/javascript"></script>

    <style>
        :root { --gov-red: #B91C1C; --gov-blue: #1E3A8A; --bg: #F8FAFC; }
        * { box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { margin: 0; background-color: var(--bg); color: #1E293B; }
        .header { background: var(--gov-blue); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 20px; }
        
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 15px; border-radius: 8px; flex: 1; border: 1px solid #E2E8F0; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 24px; color: var(--gov-blue); }
        .stat-card p { margin: 5px 0 0; color: #64748B; font-size: 14px; }

        .table-card { background: #fff; border-radius: 8px; border: 1px solid #E2E8F0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #F1F5F9; color: #334155; }
        
        .btn-action { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #fff; margin-right: 5px; }
        .btn-approve { background: #166534; }
        .btn-reject { background: #991B1B; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-Pending { background: #FEF08A; color: #854D0E; }
        .badge-Approved { background: #DCFCE7; color: #166534; }
        .badge-Rejected { background: #FEE2E2; color: #991B1B; }

        input, select { padding: 6px; border: 1px solid #CBD5E1; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <h2>🛠️ पटके प्रणाली - कार्यालय एडमिन प्यानल</h2>
    <button onclick="loadRequests()" style="padding: 8px 15px; cursor: pointer; border-radius: 5px; border: none; background: #fff; color: var(--gov-blue); font-weight: bold;">🔄 डाटा रिफ्रेस गर्नुहोस्</button>
</div>

<div class="container">
    <div class="stats">
        <div class="stat-card"><h3 id="stat-total">0</h3><p>कुल आवेदन</p></div>
        <div class="stat-card"><h3 id="stat-pending" style="color: #854D0E;">0</h3><p>प्रक्रियामा (Pending)</p></div>
        <div class="stat-card"><h3 id="stat-approved" style="color: #166534;">0</h3><p>स्वीकृत (Approved)</p></div>
        <div class="stat-card"><h3 id="stat-revenue" style="color: var(--gov-red);">रु. 0</h3><p>जम्मा संकलित राजस्व</p></div>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>आवेदन मिति (BS)</th>
                    <th>सवारी नं</th>
                    <th>लाइसेन्स नं</th>
                    <th>रुट / दुरी</th>
                    <th>कागजातहरू</th>
                    <th>राजस्व रकम (रु)</th>
                    <th>म्याद सकिने मिति (BS)</th>
                    <th>कैफियत (Remarks)</th>
                    <th>स्थिति</th>
                    <th>कार्य (Action)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="10" style="text-align:center;">डाटा लोड हुँदैछ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ यहाँ तपाईंको Apps Script Web App URL हाल्नुहोस्
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPaSA9POO_-MEWTPmq3gi-jd6H9ZgXsMLLefY2JXyKq2sw2VkaYLzKmaT2lUrYJYBTpw/exec";

    async function loadRequests() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">डाटा लोड हुँदैछ...</td></tr>';

        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            let total = data.length;
            let pending = 0;
            let approved = 0;
            let revenue = 0;

            tbody.innerHTML = '';

            data.forEach((r) => {
                if(r.status === 'Pending') pending++;
                if(r.status === 'Approved') {
                    approved++;
                    revenue += Number(r.amount || 0);
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.date || '-'}</td>
                    <td><b>${r.vNo}</b></td>
                    <td>${r.lNo}</td>
                    <td>${r.route}<br><small>(${r.dist})</small></td>
                    <td>
                        ${r.routePhoto ? `<a href="${r.routePhoto}" target="_blank">रुट पर्मिट</a><br>` : ''}
                        ${r.fitPhoto ? `<a href="${r.fitPhoto}" target="_blank">जाँचपास</a>` : ''}
                    </td>
                    <td><input type="number" id="amt-${r.id}" value="${r.amount || 500}" style="width:70px;"></td>
                    <td><input type="text" id="exp-${r.id}" class="nepali-datepicker" value="${r.expDate || r.date || ''}" placeholder="YYYY-MM-DD" style="width:110px;"></td>
                    <td><input type="text" id="rem-${r.id}" value="${r.remarks || ''}" placeholder="कैफियत..." style="width:100px;"></td>
                    <td><span class="badge badge-${r.status}">${r.status}</span></td>
                    <td>
                        <button class="btn-action btn-approve" onclick="updateRecord(${r.id}, 'Approved')">स्वीकृत</button>
                        <button class="btn-action btn-reject" onclick="updateRecord(${r.id}, 'Rejected')">अस्वीकृत</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-approved').innerText = approved;
            document.getElementById('stat-revenue').innerText = "रु. " + revenue;

            // Activate Nepali Date Picker on freshly loaded input elements
            setTimeout(() => {
                const dateInputs = document.querySelectorAll('.nepali-datepicker');
                dateInputs.forEach(input => {
                    if (typeof NepaliFunctions !== "undefined") {
                        input.nepaliDatePicker({ ndpYear: true, ndpMonth: true });
                    }
                });
            }, 100);

        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; color:red;">डाटा तान्न समस्या भयो!</td></tr>';
        }
    }

    async function updateRecord(rowId, status) {
        const expDate = document.getElementById(`exp-${rowId}`).value;
        const amount = document.getElementById(`amt-${rowId}`).value;
        const remarks = document.getElementById(`rem-${rowId}`).value;

        const payload = {
            action: "updateStatus",
            rowId: rowId,
            status: status,
            expDate: expDate,
            amount: amount,
            remarks: remarks
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            alert(`आवेदन ${status} भयो!`);
            loadRequests();
        } catch(e) {
            alert("अपडेट गर्न सकिएन!");
        }
    }

    window.onload = loadRequests;
</script>
</body>
</html>
